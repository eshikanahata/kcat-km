base: ens_lf_l6.yaml
name: ens3_lf_l6_trees
notes: "layer-6 features; LightGBM + ExtraTrees + CatBoost only (the two neural members cost ~2/3 of the training time for ~0.1-0.25 of the weight). Tune weights afterwards."
model:
  name: ensemble
  members:
    - name: lgbm
      weight: 1.0
      params: {n_estimators: 1500, learning_rate: 0.03, num_leaves: 63, min_child_samples: 20, subsample: 0.8,
               subsample_freq: 1, colsample_bytree: 0.3, reg_lambda: 1.0, objective: huber, alpha: 1.0}
    - name: extratrees
      weight: 1.0
      params: {n_estimators: 300, max_features: 0.2, min_samples_leaf: 5}
    - name: catboost
      weight: 1.0
      params: {iterations: 2000, learning_rate: 0.05, depth: 8, rsm: 0.2, l2_leaf_reg: 3.0,
               loss_function: "Huber:delta=1.0"}

base: ens_lf.yaml
name: ens_lf_esm150
notes: "vs ens_lf: ESM-2 150M (first 20 of 30 layers, int8) instead of 35M. Sized to fit 2-CPU inference."
features:
  - seq_len
  - seq_physchem
  - morgan: {radius: 2, n_bits: 1024, counts: true}
  - rdkit_desc
  - esm: {model: facebook/esm2_t30_150M_UR50D, pooling: mean, num_layers: 20, quantize: int8}
  - chemberta: {model: DeepChem/ChemBERTa-77M-MTR}
label_features:
  emb_prefix: esm2_t30_150M_mean_

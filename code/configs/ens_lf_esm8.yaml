base: ens_lf.yaml
name: ens_lf_esm8
notes: "ens_lf with ESM-2 8M (fast enough for the slow grader on the 848-enzyme test set)."
features:
  - seq_len
  - seq_physchem
  - morgan: {radius: 2, n_bits: 1024, counts: true}
  - rdkit_desc
  - esm: {model: facebook/esm2_t6_8M_UR50D, pooling: mean}
  - chemberta: {model: DeepChem/ChemBERTa-77M-MTR}
label_features:
  emb_prefix: esm2_t6_8M_mean_

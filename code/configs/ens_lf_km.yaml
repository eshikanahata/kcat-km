base: ens_lf.yaml
name: ens_lf_km
notes: "vs ens_lf: + aac, dpc, MACCS (Km-oriented features; dropping aac/dpc had cost ~0.009 Km earlier)."
features:
  - seq_len
  - aac
  - dpc
  - seq_physchem
  - morgan: {radius: 2, n_bits: 1024, counts: true}
  - maccs
  - rdkit_desc
  - esm: {model: facebook/esm2_t12_35M_UR50D, pooling: mean}
  - chemberta: {model: DeepChem/ChemBERTa-77M-MTR}

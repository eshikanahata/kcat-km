base: ens_lf.yaml
name: ens_lf_l6
notes: "ens_lf with ESM-2 35M cut after layer 6 (lgbm_lf_l6 beat lgbm_lf_l8; faster inference)."
features:
  - seq_len
  - seq_physchem
  - morgan: {radius: 2, n_bits: 1024, counts: true}
  - rdkit_desc
  - esm: {model: facebook/esm2_t12_35M_UR50D, pooling: mean, num_layers: 6}
  - chemberta: {model: DeepChem/ChemBERTa-77M-MTR}

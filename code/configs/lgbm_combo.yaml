base: lgbm_esm.yaml
name: lgbm_combo
notes: "lean features (no aac/dpc) + ChemBERTa, squared loss. Combines the two clear wins from the 22 Oct batch."
features:
  - seq_len
  - seq_physchem
  - morgan: {radius: 2, n_bits: 1024, counts: true}
  - rdkit_desc
  - esm: {model: facebook/esm2_t12_35M_UR50D, pooling: mean}
  - chemberta: {model: DeepChem/ChemBERTa-77M-MTR}

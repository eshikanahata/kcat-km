base: lgbm_handcrafted.yaml
name: lgbm_esm35m
notes: Hand-crafted features + ESM-2 35M mean-pooled embeddings, LightGBM per target.
features:
  - seq_len
  - aac
  - dpc
  - seq_physchem
  - morgan: {radius: 2, n_bits: 1024, counts: true}
  - rdkit_desc
  - esm: {model: facebook/esm2_t12_35M_UR50D, pooling: mean}

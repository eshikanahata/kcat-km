base: lgbm_esm.yaml
name: lgbm_esm_chemberta
notes: "vs lgbm_esm35m: add ChemBERTa-77M-MTR SMILES embeddings, aimed at unseen substrates (39% of val)."
features:
  - seq_len
  - aac
  - dpc
  - seq_physchem
  - morgan: {radius: 2, n_bits: 1024, counts: true}
  - rdkit_desc
  - esm: {model: facebook/esm2_t12_35M_UR50D, pooling: mean}
  - chemberta: {model: DeepChem/ChemBERTa-77M-MTR}

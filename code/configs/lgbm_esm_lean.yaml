base: lgbm_esm.yaml
name: lgbm_esm_lean
notes: "vs lgbm_esm35m: drop aac+dpc (421 cols). Does ESM make composition features redundant noise?"
features:
  - seq_len
  - seq_physchem
  - morgan: {radius: 2, n_bits: 1024, counts: true}
  - rdkit_desc
  - esm: {model: facebook/esm2_t12_35M_UR50D, pooling: mean}

base: lgbm_lf.yaml
name: lgbm_lf_l4
notes: "vs lgbm_lf: ESM-2 35M cut after layer 4 of 12 (middle layers often transfer better; ~33% of the ESM inference time)."
features:
  - seq_len
  - seq_physchem
  - morgan: {radius: 2, n_bits: 1024, counts: true}
  - rdkit_desc
  - esm: {model: facebook/esm2_t12_35M_UR50D, pooling: mean, num_layers: 4}
  - chemberta: {model: DeepChem/ChemBERTa-77M-MTR}

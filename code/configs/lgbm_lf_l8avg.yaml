base: lgbm_lf.yaml
name: lgbm_lf_l8avg
notes: "vs lgbm_lf_l8: average of the 35M hidden states after layers 4, 6 and 8 (same forward pass, same inference time)."
features:
  - seq_len
  - seq_physchem
  - morgan: {radius: 2, n_bits: 1024, counts: true}
  - rdkit_desc
  - esm: {model: facebook/esm2_t12_35M_UR50D, pooling: mean, num_layers: 8, layers: [4, 6, 8]}
  - chemberta: {model: DeepChem/ChemBERTa-77M-MTR}

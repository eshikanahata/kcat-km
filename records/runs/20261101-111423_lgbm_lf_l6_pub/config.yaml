split:
  strategy: seq_kmer
  threshold: 0.3
  n_folds: 5
  seed: 42
seeds:
- 42
features:
- seq_len
- seq_physchem
- morgan:
    radius: 2
    n_bits: 1024
    counts: true
- rdkit_desc
- esm:
    model: facebook/esm2_t12_35M_UR50D
    pooling: mean
    num_layers: 6
- chemberta:
    model: DeepChem/ChemBERTa-77M-MTR
model:
  name: lgbm
  params:
    n_estimators: 1500
    learning_rate: 0.03
    num_leaves: 63
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.3
    reg_lambda: 1.0
    objective: huber
    alpha: 1.0
data:
  subsample: null
  extra_data: true
  extra_targets:
  - log10_kcat
  - log10_km
  extra_file: extra_public.parquet
label_features:
  emb_prefix: esm2_t12_35M_mean_
  inner_folds: 5
  smiles_te:
    smoothing: 5
  enzyme_knn:
    k: 10
    tau: 0.1
  pair_nn:
    tau: 0.1
name: lgbm_lf_l6_pub
notes: competition train + ONLY the new public pairs (DLKcat kcat, CatPred Km; none
  of Leak-CURBER's own rows). Each row trains the targets it has labels for.
